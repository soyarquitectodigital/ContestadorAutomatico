worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS interno de Docker: resuelve los nombres en cada request y evita que
    # Nginx conserve IPs viejas cuando se recrea un contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Necesario para el upgrade de WebSocket de Socket.IO.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP: solo validación ACME y redirección a HTTPS.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS con el certificado de la IP.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        client_max_body_size 2m;

        ssl_certificate     /etc/letsencrypt/live/144.91.73.212/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/144.91.73.212/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /cuenta-1 { return 301 /cuenta-1/; }
        location /cuenta-1/ {
            set $backend contestador-1:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /cuenta-2 { return 301 /cuenta-2/; }
        location /cuenta-2/ {
            set $backend contestador-2:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /cuenta-3 { return 301 /cuenta-3/; }
        location /cuenta-3/ {
            set $backend contestador-3:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /cuenta-4 { return 301 /cuenta-4/; }
        location /cuenta-4/ {
            set $backend contestador-4:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /cuenta-5 { return 301 /cuenta-5/; }
        location /cuenta-5/ {
            set $backend contestador-5:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /cuenta-6 { return 301 /cuenta-6/; }
        location /cuenta-6/ {
            set $backend contestador-6:3000;
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        location / {
            return 404;
        }
    }
}
