# Despliegue en Render (https://render.com)
#
# Persistencia: hay dos opciones.
#   A) Turso (recomendada, gratis): define TURSO_DATABASE_URL y TURSO_AUTH_TOKEN
#      (abajo) y TODO se guarda en la nube: registros, cuentas, contraseña y la
#      sesión de WhatsApp. Con Turso puedes quitar el disco y usar plan free.
#   B) Disco persistente (de pago): el disco guarda las sesiones de WhatsApp
#      (data/auth_info) y la configuración entre reinicios.
#      Los discos persistentes no están disponibles en el plan free.
#
# Pasos:
#   1. Sube el repositorio a GitHub/GitLab.
#   2. En Render: New -> Blueprint -> selecciona el repositorio.
#   3. Render crea el servicio con su disco y variables; espera el deploy.
#   4. Abre la URL del servicio y crea la contraseña maestra en el primer acceso.

services:
  - type: web
    name: contestador-automatico
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      # Opción A (recomendada): persistencia en la nube con Turso.
      # Crea la base en https://app.turso.tech y descomenta:
      # - key: TURSO_DATABASE_URL
      #   value: libsql://tu-base-tu-org.turso.io
      # - key: TURSO_AUTH_TOKEN
      #   sync: false
      # Opcional: fija la contraseña maestra por entorno en lugar del primer acceso
      # - key: MASTER_KEY
      #   sync: false
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
